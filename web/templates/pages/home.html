{{define "title"}}{{t "app.name"}}{{end}}

{{define "content"}}
<section class="card">
    <h1>{{t "app.name"}}</h1>
    <p>{{t "home.tagline"}}</p>
    {{if .Closed}}
    <a class="button" href="/results">{{t "results.link"}}</a>
    {{else}}
    <a class="button" href="/login">{{t "home.login"}}</a>
    {{end}}
</section>
<p class="footer-links muted"><a href="/admin">{{t "home.admin_link"}}</a></p>
{{end}}
