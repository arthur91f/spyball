# Thème d'origine : un gala d'ONG infiltré par les espions de toutes les nations.
#
# story      : récit affiché en tête des règles ; une ligne vide sépare deux paragraphes.
#
# teams      : nom des camps (blue, red) ; « member » désigne un membre du camp
#              et remplace {blue} ou {red} dans les signes et les défis.
# traitor    : nom d'un traître (name), nom de leur camp (team) et description. Un traître est un membre ordinaire
#              de son camp pour les alliés et les ennemis, mais son score compte pour le camp des traîtres,
#              qui marque aussi les points des défis réalisés.
# characters : personnages par couleur. L'emplacement <couleur>-N reçoit le N-ième personnage de sa couleur.
#              Les noms doivent être uniques : ils servent de mot de passe aux joueurs.
# signs      : signes tirés au hasard (sans doublon), un par joueur selon sa couleur.
# challenges : défis tirés au hasard (sans doublon) pour la partie, les mêmes pour tous les traîtres :
#              une action discrète à réussir pendant la soirée. À la fin, l'organisateur atteste qui l'a réussie.

name: Le bal des nations
story: >-
  Lors d'un sommet international, l'ONG P.L.S. (Pour La Santé) organise un gala au profit du
  Fonds pour l'Enfant et les Thérapies Énergétiques. Sous couvert de soutenir cette noble cause,
  les grandes puissances y voient l'occasion rêvée d'infiltrer leurs espions.

  Pendant la soirée, chaque espion devra retrouver ses alliés et débusquer les agents des puissances rivales.

teams:
  blue:
    name: Démocraties du monde libre
    member: démocrate
    description: >-
      Leurs espions se reconnaissent par la parole : traquez les tics de langage
      et les drôles de façons de s'exprimer.
  red:
    name: Puissances autoritaires
    member: autocrate
    description: >-
      Méfiants envers les beaux discours, leurs espions communiquent par gestes :
      soyez attentifs aux postures, mimiques et manies étranges.

traitor:
  name: Agent double
  team: Agents doubles
  description: >-
    Officiellement, tu sers ton camp. Mais tu as aussi tes propres affaires à mener,
    et personne ne doit s'en apercevoir.

characters:
  blue:
    - name: USA
    - name: Royaume-Uni
    - name: Allemagne
    - name: France
    - name: Canada
    - name: Japon
    - name: Italie
  red:
    - name: Russie
    - name: Chine
    - name: Corée du Nord
    - name: Iran
    - name: Biélorussie
    - name: Cuba

signs:
  blue:
    - utiliser des sigles
    - utiliser des onomatopées
    - dire tout le temps « euh »
    - chanter ou fredonner un air connu
    - faire des bruits de bouche (siffler…)
    - utiliser des anglicismes
    - être grossier, jurer
    - raconter des anecdotes
    - dire « canopé » au lieu de « canapé » et « roser » au lieu de « poser »
    - dire « père » au lieu de « verre » et « boire » au lieu de « voir »
    - utiliser des mots qui riment avec « tristitude »
    - utiliser des mots qui riment avec « fromage »
    - commencer ses phrases par « en vrai »
  red:
    - s'exprimer en mimant
    - avoir les mains sur les hanches
    - faire tomber et ramasser quelque chose
    - faire des clins d'œil
    - faire des sourires en coin
    - se gratter le nez
    - se gratter la tête, se recoiffer
    - s'étirer les doigts, les mains
    - hausser les sourcils ou les épaules
    - éteindre ou allumer la lumière « par erreur »
    - croiser les bras
    - lever le petit doigt en buvant
    - se moucher
    - faire des checks de plus de deux mouvements
    - regarder l'heure ostensiblement
    - tapoter du pied en rythme

challenges:
  - déplacer les BDs Snoopy sur l'étagère du bas
  - accrocher un grelot à la porte
  - allumer la lumière de la hotte
  - mettre un pins dans un pot du balcon
  - trier les bouteilles d'alcool sur la table par ordre alphabétique
  - coincoin doit retrouver coincouine
  - mettre une pince à linge dans le dos de quelqu'un
  - cacher la souris dans une chaussure
 
