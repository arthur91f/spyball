admin:
  title: Administration
  logout: Se déconnecter
  login:
    title: Connexion admin
    password: Mot de passe admin
    submit: Se connecter
    wrong_password: Mot de passe incorrect.
  players:
    title: Joueurs (%d)
    none: Aucun joueur pour l'instant.
    remove: Retirer
    add_label: Ajouter des joueurs (un nom par ligne)
    add_placeholder: "Alice\nBob\nChloé"
    add: Ajouter
  draw:
    title: Tirage des rôles
    theme: Thème
    setups: >-
      La configuration (nombre de traîtres, indices…) sera tirée au sort parmi celles prévues pour ce nombre de joueurs,
      selon leur poids. Elle restera secrète jusqu'à la clôture.
    chance: "(%d %%)"
    submit: Tirer les rôles au sort
    confirm: Tirer les rôles maintenant ? La liste des joueurs ne pourra plus être modifiée sans annuler le tirage.
    no_setup: Aucune configuration n'existe pour %d joueurs. Ajoutez ou retirez des joueurs.
