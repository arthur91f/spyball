# Textes de l'interface. Les clés imbriquées s'utilisent avec des points : {{t "home.tagline"}}.
# Les textes avec %d ou %s s'utilisent avec tf : {{tf "admin.players.title" 12}}.
# Une clé manquante fait échouer le rendu de la page (et les tests).

app:
  name: Spyball

home:
  tagline: Trouvez vos alliés, démasquez vos ennemis.
  login: Découvrir mon rôle
  admin_link: Administration

login:
  title: Connexion
  not_started: La partie n'a pas encore commencé. Reviens quand l'organisateur aura tiré les rôles au sort.
  name: Ton nom
  choose_name: Choisis ton nom…
  character: Ton personnage
  character_help: >-
    Laisse vide à ta première connexion : on te dévoilera ton personnage.
    Ensuite, il te servira de mot de passe (majuscules, accents, espaces et ponctuation sont ignorés).
  submit: Entrer

role:
  title: Mon rôle
  logout: Se déconnecter
  welcome: >-
    Retiens bien le nom de ton personnage : il te servira de mot de passe pour te reconnecter.
    Et garde-le secret !
  closed: La partie est terminée, tes suppositions ne peuvent plus être modifiées.
  you_are: "%s, tu es :"
  white_help: >-
    Tu n'appartiens à aucun camp : avant la fin de la partie, choisis de rejoindre l'un des deux camps
    ou de rester neutre. Pour le score, tu compteras entièrement comme membre du camp choisi.
  rules:
    ally_of_everyone: Pour le décompte des points, tu es l'allié de tout le monde.
    enemy_of_everyone: Pour le décompte des points, tu es l'ennemi de tout le monde.
  signs:
    title: Ton signe
    help: >-
      Fais-le régulièrement pendant la soirée pour que tes alliés te repèrent,
      mais pas trop : les joueurs attentifs pourraient se méfier.
    for: "Pour te faire reconnaître des %s :"
  clues:
    title: Tes indices
    help: "Tu reconnaîtras ces personnages à leur signe :"
    none: Tu n'as aucun indice. À toi d'observer !
    or: ou
  camp:
    title: Ton camp
    help: Tu peux changer d'avis jusqu'à la fin de la partie.
    submit: Enregistrer mon choix
  guesses:
    title: Mes suppositions
    help: >-
      Pour chaque joueur, indique si tu penses qu'il est ton allié ou ton ennemi.
      Bonne réponse : +1 point, mauvaise réponse : −1 point. Laisse « ? » si tu ne sais pas.
    ally: Allié
    none: "?"
    enemy: Ennemi
    submit: Enregistrer mes suppositions
    saved: Suppositions enregistrées.

error:
  home: Retour à l'accueil

format:
  decimal_separator: ","

nav:
  rules: Règles

rules:
  title: Règles du jeu
  theme: Thème
  show: Afficher
  goal: >-
    Chaque invité reçoit en secret un personnage et un camp. Pendant toute la soirée, sans en avoir l'air,
    tu dois retrouver tes alliés et démasquer tes ennemis. À la fin, tout est dévoilé et on compte les points.
  camps:
    title: Les camps
    balance: >-
      Les deux camps comptent autant de joueurs. Les autres joueurs sont neutres, au rôle un peu à part :
    white: >-
      Les non-alignés reçoivent un signe de chaque camp et choisissent, avant la fin de la partie,
      de rejoindre les %s, les %s, ou de rester neutres.
    ally_of_everyone: "%s : allié de tout le monde. Tout le monde a intérêt à le désigner comme allié."
    enemy_of_everyone: "%s : ennemi de tout le monde. Tout le monde a intérêt à le désigner comme ennemi… s'il ne se fait pas passer pour un allié."
  role:
    title: Ton rôle
    character: Un personnage, qui indique ton camp. Garde-le secret !
    sign: >-
      Un signe d'appel : un comportement à glisser régulièrement dans la soirée pour que tes alliés te repèrent.
      Pas trop souvent : les joueurs attentifs pourraient se méfier.
    white_signs: Les non-alignés ont deux signes, un pour chaque camp, et choisissent par qui se faire reconnaître.
    clues: Des indices sur quelques autres personnages et leur signe, pour t'aider à les repérer.
    login: >-
      Pour découvrir ton rôle, connecte-toi avec ton nom. Le site te révèle ton personnage : retiens-le,
      il te servira de mot de passe pour te reconnecter.
  party:
    title: Pendant la soirée
    observe: Observe les autres invités et repère qui fait les signes de tes indices.
    reveal: >-
      Quand tu penses avoir trouvé un allié, à toi de voir comment te dévoiler : un mot glissé à l'oreille,
      un message sur un bout de papier…
    discretion: >-
      Reste discret : un joueur surpris à parler du jeu peut être dénoncé publiquement,
      et l'organisateur pourra le pénaliser à la fin.
    guesses: >-
      Sur le site, indique pour chaque joueur si tu penses qu'il est ton allié ou ton ennemi.
      Tu peux changer d'avis jusqu'à la clôture de la partie.
  score:
    title: Le décompte des points
    right: "+1 point par allié ou ennemi correctement identifié ;"
    wrong: "−1 point par allié désigné comme ennemi ou ennemi désigné comme allié ;"
    manual: "des points donnés par l'organisateur : défis réussis, dénonciations publiques…"
    relations: "Qui est allié de qui :"
    same_camp: deux joueurs du même camp sont alliés, deux joueurs de camps différents sont ennemis ;
    neutral: "les %s restés neutres sont des ennemis pour les deux camps, et des alliés entre eux ;"
    white: un non-aligné qui a rejoint un camp compte entièrement comme membre de ce camp ;
    special: les rôles spéciaux ci-dessus font exception (l'allié de tout le monde l'emporte sur l'ennemi de tout le monde).
    teams: >-
      Le score d'un camp est la somme des scores de ses joueurs. Moins nombreux, les %s voient
      leur score multiplié par %d divisé par leur nombre. Le camp qui a le plus de points gagne !
  cast:
    title: Les personnages de cette partie
    help: "Configuration « %s ». Qui les incarne ? C'est à toi de le découvrir."
    white: Non-alignés
    yellow: Rôles spéciaux

results:
  title: Résultats
  link: Voir les résultats
  not_yet: Les résultats seront visibles quand l'organisateur aura clôturé la partie.
  points: pts
  teams:
    title: Classement des camps
    members: "%d joueurs"
    weighted: "somme %d × %d/%d (bonus des neutres)"
    winner: Victoire !
  players:
    title: Classement des joueurs
    help: Touche un joueur pour voir le détail de ses suppositions.
    white: non-aligné rallié
    ally_of_everyone: allié de tous
    enemy_of_everyone: ennemi de tous
    right: "%d bonne(s) réponse(s)"
    wrong: "%d erreur(s)"
    manual: "%s point(s) manuel(s)"
    no_guess: Aucune supposition.
  guess:
    ally: allié
    enemy: ennemi
    correct: juste
    wrong: faux
  manual:
    title: Points manuels
    none: Aucun point manuel pour l'instant.
    remove: Annuler
    add_title: Ajouter des points
    player: Joueur
    choose_player: Choisis un joueur…
    points: Points (négatif pour une pénalité)
    reason: Raison
    reasons:
      challenge: Défi réussi
      denounced: Dénoncé publiquement
      denouncer: Dénonciation publique
    add: Ajouter

admin:
  title: Administration
  logout: Se déconnecter
  login:
    title: Connexion admin
    password: Mot de passe admin
    submit: Se connecter
    wrong_password: Mot de passe incorrect.
  players:
    title: Joueurs (%d)
    none: Aucun joueur pour l'instant.
    remove: Retirer
    add_label: Ajouter des joueurs (un nom par ligne)
    add_placeholder: "Alice\nBob\nChloé"
    add: Ajouter
  draw:
    title: Tirage des rôles
    theme: Thème
    setup: Configuration
    submit: Tirer les rôles au sort
    confirm: Tirer les rôles maintenant ? La liste des joueurs ne pourra plus être modifiée sans annuler le tirage.
    no_setup: Aucune configuration n'existe pour %d joueurs. Ajoutez ou retirez des joueurs.
    players: "%d joueurs"
  running:
    title: Partie en cours
    help: >-
      Les joueurs se connectent avec leur nom pour découvrir leur rôle.
      Clôturez la partie à la fin de la soirée pour figer les suppositions et afficher les résultats.
    close: Clôturer la partie
    close_confirm: Clôturer la partie ? Les joueurs ne pourront plus modifier leurs suppositions.
  login_status:
    help: >-
      Un joueur qui a oublié son personnage peut se reconnecter avec son seul nom
      si vous réinitialisez sa connexion.
    logged_in: Connecté
    not_yet: Pas encore connecté
    reset: Réinitialiser
    reset_confirm: "Réinitialiser la connexion de %s ? Il pourra se reconnecter avec son seul nom."
  cancel:
    title: Annuler le tirage
    help: Revient à la saisie des joueurs. Tous les rôles et toutes les suppositions seront perdus.
    submit: Annuler le tirage
    confirm: Annuler le tirage ? Tous les rôles et toutes les suppositions seront perdus.
  closed:
    title: Partie terminée
    help: Les suppositions sont figées. Les résultats sont visibles par tous.
    results: Voir les résultats et attribuer des points
  reset:
    title: Nouvelle partie
    help: Efface tout (joueurs, rôles, suppositions, points) pour recommencer de zéro.
    submit: Commencer une nouvelle partie
    confirm: Tout effacer et commencer une nouvelle partie ?

