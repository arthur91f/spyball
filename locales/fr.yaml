# Textes de l'interface. Les clés imbriquées s'utilisent avec des points : {{t "home.tagline"}}.
# Les textes avec %d ou %s s'utilisent avec tf : {{tf "admin.players.title" 12}}.
# Une clé manquante fait échouer le rendu de la page (et les tests).

app:
  name: Spyball
  lang: fr

home:
  tagline: Trouvez vos alliés, démasquez vos ennemis.
  login: Découvrir mon rôle
  rules: Lire les règles
  admin_link: Administration

login:
  title: Connexion
  not_started: La partie n'a pas encore commencé. Reviens quand l'organisateur aura tiré les rôles au sort.
  name: Ton nom
  choose_name: Choisis ton nom…
  character: Ton personnage
  character_help: >-
    Laisse vide à ta première connexion : on te dévoilera ton personnage.
    Ensuite, il te servira de mot de passe (majuscules, accents, espaces et ponctuation sont ignorés).
  submit: Entrer

role:
  title: Mon rôle
  logout: Se déconnecter
  welcome: >-
    Retiens bien le nom de ton personnage : il te servira de mot de passe pour te reconnecter.
    Et garde-le secret !
  closed: La partie est terminée, tes suppositions ne peuvent plus être modifiées.
  you_are: "%s, tu es :"
  traitor_help: >-
    Pour les alliés et les ennemis, tu es un membre ordinaire de ton camp. Mais tu as aussi des défis,
    et ton score compte pour le camp des traîtres, pas pour ton camp.
  sign:
    title: Ton signe
    help: >-
      Fais-le régulièrement pendant la soirée pour que tes alliés te repèrent,
      mais pas trop : les joueurs attentifs pourraient se méfier.
  challenges:
    title: Tes défis
    help: >-
      Les traîtres ont tous ces défis : réussissez-les pendant la soirée, sans vous faire repérer.
      À la fin, l'organisateur indiquera lesquels ont été réalisés : +%d points pour le camp des traîtres
      par défi réalisé, quel que soit le traître qui l'a fait. Si tu vois quelqu'un s'y essayer, tu sais à qui tu as affaire.
  clues:
    title: Tes indices
    help: "Tu reconnaîtras ces joueurs à leur signe :"
    none: Tu n'as aucun indice. À toi d'observer !
  guesses:
    title: Mes suppositions
    help: >-
      Pour chaque joueur, indique si tu penses qu'il est ton allié ou ton ennemi.
      Laisse « ? » si tu ne sais pas.
    points: >-
      Allié trouvé : %+d, ennemi trouvé : %+d, erreur : %d.
      Chaque joueur qui te désigne comme allié te rapporte %+d, chaque joueur qui te désigne comme ennemi : %d,
      qu'il ait raison ou non. Un score peut être négatif.
    ally: Allié
    none: "?"
    enemy: Ennemi
    submit: Enregistrer mes suppositions
    saved: Suppositions enregistrées.

error:
  home: Retour à l'accueil

nav:
  rules: Règles

rules:
  title: Règles du jeu
  theme: Thème
  show: Afficher
  goal: >-
    Chaque invité reçoit en secret un personnage et un camp. Pendant toute la soirée, sans en avoir l'air,
    tu dois retrouver tes alliés et démasquer tes ennemis. À la fin, tout est dévoilé et on compte les points.
  camps:
    title: Les camps
    balance: Les deux camps ne comptent pas forcément autant de joueurs.
    traitors: >-
      Des traîtres se cachent parmi les joueurs, environ un tous les 4 ou 5 joueurs. Combien dans chaque camp ?
      Cela dépend de la configuration tirée au sort, qui reste secrète jusqu'à la fin.
      Un traître reste un membre ordinaire de son camp pour les alliés et les ennemis, mais il a aussi des défis
      à relever. Les traîtres forment un camp à part pour le score : leurs points et ceux des défis réalisés
      comptent pour ce camp, pas pour celui dont ils portent les couleurs.
  role:
    title: Ton rôle
    character: Un personnage, qui indique ton camp. Garde-le secret !
    sign: >-
      Un signe d'appel : un comportement à glisser régulièrement dans la soirée pour que tes alliés te repèrent.
      Pas trop souvent : les joueurs attentifs pourraient se méfier.
    clues: >-
      Des indices sur quelques autres joueurs : leur camp et leur signe, pour t'aider à les repérer
      (jamais leur personnage, qui leur sert de mot de passe, ni s'ils sont traîtres).
    challenges: >-
      Pour les traîtres, des défis, les mêmes pour tous les traîtres de la partie : des actions discrètes
      à réussir pendant la soirée sans se faire repérer. À la fin, l'organisateur indique quels défis ont été
      réalisés : chacun rapporte des points au camp des traîtres, quel que soit celui qui l'a fait.
    login: >-
      Pour découvrir ton rôle, connecte-toi avec ton nom. Le site te révèle ton personnage : retiens-le,
      il te servira de mot de passe pour te reconnecter.
  party:
    title: Pendant la soirée
    observe: Observe les autres invités et repère qui fait les signes de tes indices.
    reveal: >-
      Quand tu penses avoir trouvé un allié, à toi de voir comment te dévoiler : un mot glissé à l'oreille,
      un message sur un bout de papier…
    discretion: >-
      Reste discret : un joueur surpris à parler du jeu peut être dénoncé publiquement,
      et l'organisateur pourra le pénaliser à la fin.
    guesses: >-
      Sur le site, indique pour chaque joueur si tu penses qu'il est ton allié ou ton ennemi.
      Tu peux changer d'avis jusqu'à la clôture de la partie.
  score:
    title: Le décompte des points
    ally_found: "%+d points par allié que tu désignes comme allié ;"
    enemy_found: "%+d points par ennemi que tu désignes comme ennemi ;"
    wrong: "%d points par erreur (allié désigné comme ennemi ou ennemi désigné comme allié) ;"
    designated_ally: "%+d points par joueur qui te désigne comme allié, qu'il ait raison ou non ;"
    designated_enemy: "%d points par joueur qui te désigne comme ennemi, qu'il ait raison ou non ;"
    challenges: "%+d points par défi réalisé, pour le camp des traîtres ;"
    manual: "des points donnés par l'organisateur : dénonciations publiques…"
    relations: >-
      Deux joueurs du même camp sont alliés, deux joueurs de camps différents sont ennemis.
      Les traîtres ne font pas exception.
    teams: >-
      Le score d'un camp est la somme des scores de ses joueurs, sans ses traîtres. Les traîtres forment leur propre
      camp : la somme de leurs scores, plus les points des défis réalisés. Le camp qui a le plus de points gagne.
      Un score peut être négatif.

